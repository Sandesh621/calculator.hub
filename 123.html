<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure E2E P2P App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Scrollbar for a polished look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: #f3f4f6; }
        .glass-panel { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(75, 85, 99, 0.4); }
        .message-in { background-color: #374151; border-bottom-left-radius: 0; }
        .message-out { background-color: #2563eb; border-bottom-right-radius: 0; }
        
        /* Progress Bar Animation */
        .progress-bar-fill { transition: width 0.2s ease; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col items-center justify-center p-4 md:p-6">

    <div class="glass-panel w-full max-w-5xl h-full flex flex-col md:flex-row rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- Sidebar: Connection Management -->
        <div class="w-full md:w-1/3 border-b md:border-b-0 md:border-r border-gray-700 p-6 flex flex-col bg-gray-800 bg-opacity-50">
            <div class="flex items-center gap-3 mb-8">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">SecureConnect</h1>
                    <p class="text-xs text-gray-400">E2E Encrypted P2P (Signal-style)</p>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-300 mb-2">Your Peer ID</label>
                <div class="flex gap-2">
                    <input type="text" id="my-id" readonly class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-sm text-gray-200 outline-none focus:border-blue-500" value="Generating...">
                    <button onclick="copyMyId()" class="bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded-lg transition-colors" title="Copy ID">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-300 mb-2">Connect to Peer</label>
                <input type="text" id="target-id" placeholder="Enter Peer ID..." class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-sm text-gray-200 outline-none focus:border-blue-500 mb-2">
                <button id="connect-btn" onclick="initiateConnection()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-link"></i> Connect
                </button>
            </div>

            <div class="mt-auto">
                <div id="status-card" class="bg-gray-900 border border-gray-700 rounded-lg p-4 flex items-center gap-3">
                    <div id="status-indicator" class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div>
                        <p id="status-text" class="text-sm font-semibold">Disconnected</p>
                        <p class="text-xs text-gray-400">Waiting for connection...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Area: Chat & File Transfer -->
        <div class="w-full md:w-2/3 h-full flex flex-col relative bg-gray-900">
            
            <!-- Chat Header -->
            <div class="h-16 border-b border-gray-700 flex items-center px-6 justify-between bg-gray-800 bg-opacity-30">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-lock text-green-400" id="lock-icon" style="opacity: 0.3;"></i>
                    <span class="font-medium" id="chat-title">Not Connected</span>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="chat-box" class="flex-1 overflow-y-auto p-6 flex flex-col gap-4">
                <div class="self-center bg-gray-800 text-gray-400 text-xs px-4 py-1 rounded-full text-center max-w-md">
                    System utilizes ECDH key exchange and AES-GCM encryption. Connections are established over WebRTC via public STUN/TURN servers.
                </div>
            </div>

            <!-- Active File Transfer UI -->
            <div id="file-transfer-ui" class="hidden absolute bottom-20 left-4 right-4 bg-gray-800 border border-gray-600 rounded-xl p-4 shadow-lg z-10">
                <div class="flex justify-between items-center mb-2">
                    <span id="file-transfer-name" class="text-sm font-medium truncate max-w-[70%]">sending_video.mp4</span>
                    <span id="file-transfer-pct" class="text-xs text-blue-400">0%</span>
                </div>
                <div class="w-full bg-gray-700 rounded-full h-2">
                    <div id="file-transfer-progress" class="bg-blue-500 h-2 rounded-full progress-bar-fill" style="width: 0%"></div>
                </div>
                <div id="file-transfer-status" class="text-xs text-gray-400 mt-2 text-right">0 MB / 0 MB</div>
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-gray-800 border-t border-gray-700">
                <div class="flex gap-2 relative">
                    <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(event)">
                    <button onclick="document.getElementById('file-input').click()" id="attach-btn" disabled class="bg-gray-700 hover:bg-gray-600 text-gray-300 w-12 h-12 rounded-xl flex items-center justify-center transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-paperclip"></i>
                    </button>
                    <input type="text" id="msg-input" disabled placeholder="Type an encrypted message..." onkeypress="handleEnter(event)" class="flex-1 bg-gray-900 border border-gray-600 rounded-xl px-4 text-gray-200 outline-none focus:border-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
                    <button onclick="sendMessage()" id="send-btn" disabled class="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 rounded-xl flex items-center justify-center transition-colors shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <p class="text-[10px] text-gray-500 mt-2 ml-14">Max file size: 500 MB</p>
            </div>
        </div>
    </div>

    <script>
        // --- Web Crypto API (Signal-Protocol E2EE Mimicry) ---
        // Generates an ECDH key pair, exchanges public keys, derives a shared AES-GCM key.
        const CryptoBox = {
            keyPair: null,
            sharedKey: null,
            encoder: new TextEncoder(),
            decoder: new TextDecoder(),

            async init() {
                this.keyPair = await crypto.subtle.generateKey(
                    { name: "ECDH", namedCurve: "P-256" },
                    true,
                    ["deriveKey", "deriveBits"]
                );
                console.log("ECDH Key Pair generated.");
            },

            async getPublicKey() {
                const exported = await crypto.subtle.exportKey("raw", this.keyPair.publicKey);
                return Array.from(new Uint8Array(exported)); // Export to send via JSON
            },

            async computeSharedSecret(peerPublicKeyArray) {
                const peerKeyBuffer = new Uint8Array(peerPublicKeyArray).buffer;
                const peerPublicKey = await crypto.subtle.importKey(
                    "raw", peerKeyBuffer,
                    { name: "ECDH", namedCurve: "P-256" },
                    true, []
                );

                this.sharedKey = await crypto.subtle.deriveKey(
                    { name: "ECDH", public: peerPublicKey },
                    this.keyPair.privateKey,
                    { name: "AES-GCM", length: 256 },
                    true,
                    ["encrypt", "decrypt"]
                );
                console.log("Shared AES-GCM Key derived successfully.");
            },

            async encryptText(text) {
                const encodedText = this.encoder.encode(text);
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encrypted = await crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    this.sharedKey,
                    encodedText
                );
                return {
                    iv: Array.from(iv),
                    data: Array.from(new Uint8Array(encrypted))
                };
            },

            async decryptText(ivArray, dataArray) {
                const iv = new Uint8Array(ivArray);
                const data = new Uint8Array(dataArray);
                const decrypted = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    this.sharedKey,
                    data
                );
                return this.decoder.decode(decrypted);
            },

            // For file chunks: Returns a single ArrayBuffer (IV + Ciphertext)
            async encryptChunk(arrayBuffer) {
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encrypted = await crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    this.sharedKey,
                    arrayBuffer
                );
                const payload = new Uint8Array(12 + encrypted.byteLength);
                payload.set(iv, 0);
                payload.set(new Uint8Array(encrypted), 12);
                return payload.buffer;
            },

            // For file chunks: Takes ArrayBuffer (IV + Ciphertext), returns decrypted ArrayBuffer
            async decryptChunk(payloadBuffer) {
                const payload = new Uint8Array(payloadBuffer);
                const iv = payload.slice(0, 12);
                const data = payload.slice(12);
                const decrypted = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    this.sharedKey,
                    data
                );
                return decrypted;
            }
        };

        let peer = null;
        let connection = null;
        let isEncrypted = false;
        
        // File receiving state
        let incomingFileInfo = null;
        let incomingFileChunks = [];
        let incomingBytesReceived = 0;

        // UI Elements
        const myIdEl = document.getElementById('my-id');
        const targetIdEl = document.getElementById('target-id');
        const connectBtn = document.getElementById('connect-btn');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const chatTitle = document.getElementById('chat-title');
        const lockIcon = document.getElementById('lock-icon');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const attachBtn = document.getElementById('attach-btn');
        const chatBox = document.getElementById('chat-box');

        // Initialize PeerJS and Crypto
        async function initializeApp() {
            await CryptoBox.init();

            // Setup PeerJS (Using their public STUN/TURN servers)
            peer = new Peer({
                config: {'iceServers': [
                    { url: 'stun:stun.l.google.com:19302' },
                    { url: 'stun:stun1.l.google.com:19302' }
                ]}
            });

            peer.on('open', (id) => {
                myIdEl.value = id;
            });

            // Listen for incoming connections
            peer.on('connection', (conn) => {
                if (connection && connection.open) {
                    conn.close(); // Only allow one connection at a time
                    return;
                }
                connection = conn;
                setupConnectionHandlers();
            });

            peer.on('error', (err) => {
                console.error("PeerJS Error:", err);
                addSystemMessage("Error: " + err.type, true);
                resetUI();
            });
        }

        function copyMyId() {
            myIdEl.select();
            document.execCommand('copy');
            addSystemMessage("Peer ID copied to clipboard.");
        }

        function initiateConnection() {
            const targetId = targetIdEl.value.trim();
            if (!targetId) return;

            connectBtn.disabled = true;
            connectBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';

            connection = peer.connect(targetId, {
                reliable: true 
            });

            setupConnectionHandlers();
        }

        function setupConnectionHandlers() {
            connection.on('open', async () => {
                statusIndicator.classList.replace('bg-red-500', 'bg-yellow-500');
                statusText.innerText = "Authenticating...";
                chatTitle.innerText = "Connected to " + connection.peer.substring(0, 8) + "...";
                
                // Initiate Key Exchange
                const pubKey = await CryptoBox.getPublicKey();
                connection.send(JSON.stringify({
                    type: 'key-exchange',
                    publicKey: pubKey
                }));
            });

            connection.on('data', handleIncomingData);

            connection.on('close', () => {
                addSystemMessage("Peer disconnected.");
                resetUI();
            });

            connection.on('error', (err) => {
                console.error("Connection Error:", err);
                resetUI();
            });
        }

        async function handleIncomingData(data) {
            // Check if it's an ArrayBuffer (Encrypted File Chunk)
            if (data instanceof ArrayBuffer) {
                await processIncomingFileChunk(data);
                return;
            }

            // Otherwise, it's a JSON string
            try {
                const parsed = JSON.parse(data);

                if (parsed.type === 'key-exchange') {
                    await CryptoBox.computeSharedSecret(parsed.publicKey);
                    isEncrypted = true;
                    enableUI();
                    
                    // If we haven't sent our key yet (we are the receiver), send it now
                    if (statusText.innerText !== "Connected (E2E Encrypted)") {
                        const myPubKey = await CryptoBox.getPublicKey();
                        connection.send(JSON.stringify({
                            type: 'key-exchange',
                            publicKey: myPubKey
                        }));
                    }
                } 
                else if (parsed.type === 'chat') {
                    const decryptedText = await CryptoBox.decryptText(parsed.iv, parsed.data);
                    renderMessage(decryptedText, 'in');
                }
                else if (parsed.type === 'file-meta') {
                    // Decrypt metadata
                    const metaJson = await CryptoBox.decryptText(parsed.iv, parsed.data);
                    incomingFileInfo = JSON.parse(metaJson);
                    incomingFileChunks = [];
                    incomingBytesReceived = 0;
                    
                    showTransferUI(incomingFileInfo.name, true);
                    addSystemMessage(`Receiving file: ${incomingFileInfo.name} (${formatBytes(incomingFileInfo.size)})`);
                }
                else if (parsed.type === 'file-done') {
                    finalizeFileDownload();
                }

            } catch (err) {
                console.error("Failed to process data:", err);
            }
        }

        async function sendMessage() {
            if (!isEncrypted || !connection || !connection.open) return;
            const text = msgInput.value.trim();
            if (!text) return;

            msgInput.value = '';
            renderMessage(text, 'out');

            try {
                const encryptedPayload = await CryptoBox.encryptText(text);
                connection.send(JSON.stringify({
                    type: 'chat',
                    ...encryptedPayload
                }));
            } catch (err) {
                console.error("Encryption failed:", err);
                addSystemMessage("Failed to encrypt and send message.", true);
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function renderMessage(text, direction) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${direction === 'out' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `px-4 py-2 rounded-2xl max-w-[80%] break-words shadow-md ${direction === 'out' ? 'message-out text-white' : 'message-in text-gray-200'}`;
            bubble.textContent = text;
            
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addSystemMessage(text, isError = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `self-center text-xs px-4 py-1 rounded-full text-center max-w-md ${isError ? 'bg-red-900/50 text-red-300' : 'bg-gray-800 text-gray-400'}`;
            wrapper.textContent = text;
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        const MAX_FILE_SIZE = 500 * 1024 * 1024; // 500 MB
        const CHUNK_SIZE = 64 * 1024; // 64 KB (Optimal for WebRTC)

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > MAX_FILE_SIZE) {
                alert("File size exceeds 500 MB limit.");
                event.target.value = '';
                return;
            }

            event.target.value = ''; // Reset input
            await startFileTransfer(file);
        }

        async function startFileTransfer(file) {
            msgInput.disabled = true;
            attachBtn.disabled = true;
            sendBtn.disabled = true;

            showTransferUI(file.name, false);
            addSystemMessage(`Encrypting and sending: ${file.name}...`);

            try {
                // 1. Send Metadata (Encrypted)
                const metadata = JSON.stringify({ name: file.name, size: file.size, type: file.type });
                const encMeta = await CryptoBox.encryptText(metadata);
                connection.send(JSON.stringify({ type: 'file-meta', ...encMeta }));

                // 2. Read and Send Chunks
                let offset = 0;
                while (offset < file.size) {
                    // Monitor DataChannel Backpressure
                    // If buffer is > 1MB, wait to prevent dropped packets or memory crashes
                    while (connection.dataChannel.bufferedAmount > 1024 * 1024) {
                        await new Promise(r => setTimeout(r, 50));
                    }

                    const slice = file.slice(offset, offset + CHUNK_SIZE);
                    const buffer = await slice.arrayBuffer();
                    
                    // Encrypt to get IV + Ciphertext ArrayBuffer
                    const encryptedBuffer = await CryptoBox.encryptChunk(buffer);
                    
                    // Send raw buffer over WebRTC
                    connection.send(encryptedBuffer);

                    offset += CHUNK_SIZE;
                    updateProgressUI(offset, file.size);
                }

                // 3. Send Completion Signal
                connection.send(JSON.stringify({ type: 'file-done' }));
                addSystemMessage("File sent successfully.");

            } catch (err) {
                console.error("File transfer error:", err);
                addSystemMessage("Error transferring file.", true);
            }

            hideTransferUI();
            msgInput.disabled = false;
            attachBtn.disabled = false;
            sendBtn.disabled = false;
        }

        async function processIncomingFileChunk(encryptedBuffer) {
            if (!incomingFileInfo) return;

            try {
                const decryptedBuffer = await CryptoBox.decryptChunk(encryptedBuffer);
                incomingFileChunks.push(decryptedBuffer);
                incomingBytesReceived += decryptedBuffer.byteLength;
                
                updateProgressUI(incomingBytesReceived, incomingFileInfo.size);
            } catch (err) {
                console.error("Chunk decryption failed", err);
            }
        }

        function finalizeFileDownload() {
            if (!incomingFileInfo) return;

            const blob = new Blob(incomingFileChunks, { type: incomingFileInfo.type });
            const url = URL.createObjectURL(blob);
            
            // Create download message element
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full justify-start`;
            
            const bubble = document.createElement('div');
            bubble.className = `px-4 py-3 rounded-2xl max-w-[80%] bg-gray-700 text-gray-200 border border-gray-600 flex items-center gap-3`;
            
            const icon = document.createElement('i');
            icon.className = "fa-solid fa-file-arrow-down text-3xl text-blue-400";
            
            const info = document.createElement('div');
            info.innerHTML = `
                <p class="text-sm font-semibold truncate max-w-[200px]">${incomingFileInfo.name}</p>
                <p class="text-xs text-gray-400">${formatBytes(incomingFileInfo.size)}</p>
            `;
            
            const dlBtn = document.createElement('a');
            dlBtn.href = url;
            dlBtn.download = incomingFileInfo.name;
            dlBtn.className = "ml-auto bg-blue-600 hover:bg-blue-500 text-white w-8 h-8 rounded-full flex items-center justify-center transition-colors";
            dlBtn.innerHTML = '<i class="fa-solid fa-download text-sm"></i>';
            
            bubble.appendChild(icon);
            bubble.appendChild(info);
            bubble.appendChild(dlBtn);
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;

            addSystemMessage("File received and decrypted successfully.");
            
            // Cleanup memory
            incomingFileChunks = [];
            incomingFileInfo = null;
            hideTransferUI();
        }

        function enableUI() {
            statusIndicator.classList.replace('bg-yellow-500', 'bg-green-500');
            statusText.innerText = "Connected (E2E Encrypted)";
            lockIcon.style.opacity = '1';
            msgInput.disabled = false;
            sendBtn.disabled = false;
            attachBtn.disabled = false;
            connectBtn.innerHTML = '<i class="fa-solid fa-link"></i> Connected';
        }

        function resetUI() {
            isEncrypted = false;
            connection = null;
            statusIndicator.classList.replace('bg-green-500', 'bg-red-500');
            statusIndicator.classList.replace('bg-yellow-500', 'bg-red-500');
            statusText.innerText = "Disconnected";
            chatTitle.innerText = "Not Connected";
            lockIcon.style.opacity = '0.3';
            msgInput.disabled = true;
            sendBtn.disabled = true;
            attachBtn.disabled = true;
            connectBtn.disabled = false;
            connectBtn.innerHTML = '<i class="fa-solid fa-link"></i> Connect';
            hideTransferUI();
        }

        const transferUiEl = document.getElementById('file-transfer-ui');
        const transferNameEl = document.getElementById('file-transfer-name');
        const transferProgressEl = document.getElementById('file-transfer-progress');
        const transferPctEl = document.getElementById('file-transfer-pct');
        const transferStatusEl = document.getElementById('file-transfer-status');

        function showTransferUI(filename, isReceiving) {
            transferUiEl.classList.remove('hidden');
            transferNameEl.innerText = (isReceiving ? "Receiving: " : "Sending: ") + filename;
            updateProgressUI(0, 1);
        }

        function hideTransferUI() {
            transferUiEl.classList.add('hidden');
        }

        function updateProgressUI(current, total) {
            const pct = Math.min(100, Math.round((current / total) * 100));
            transferProgressEl.style.width = pct + '%';
            transferPctEl.innerText = pct + '%';
            transferStatusEl.innerText = `${formatBytes(current)} / ${formatBytes(total)}`;
        }

        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        // Boot
        window.onload = initializeApp;

    </script>
</body>
</html>
