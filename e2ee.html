<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2EE Nexus Chat (Large Files)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden; 
            color: #1e293b; 
        }

        /* Animated Soft Light Gradient Background */
        @keyframes pastelBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #fdfbfb, #ebedee, #f3e7e9, #e3eeff, #e0c3fc, #8ec5fc);
            background-size: 400% 400%;
            animation: pastelBG 20s ease infinite;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Glassmorphism Classes for Light Theme */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
        }
        
        .glass-input {
            background: #f1f5f9; 
            border: 1px solid #e2e8f0; 
            color: #1e293b;
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
            background: #ffffff;
        }

        .btn-glow {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }
        .btn-glow:disabled {
            background: #cbd5e1;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
            color: #64748b;
        }

        .btn-glow-green {
            background: linear-gradient(135deg, #10b981, #14b8a6);
            transition: all 0.3s ease;
        }
        .btn-glow-green:hover {
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }

        /* Chat Bubbles */
        .msg-self {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-radius: 18px 18px 0 18px;
            box-shadow: 0 4px 15px -3px rgba(99, 102, 241, 0.3);
            color: white;
        }
        
        .msg-peer {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 18px 18px 18px 0;
            color: #1e293b;
            box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.05);
        }

        .file-card-self {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .file-card-peer {
            background: white;
            border: 1px solid #e2e8f0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: rgba(148, 163, 184, 0.4); 
            border-radius: 10px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }

        /* Notification Toast Animations */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .toast-exit { animation: fadeOut 0.3s ease forwards; }
    </style>
</head>
<body class="animated-bg">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <div class="glass-panel w-full max-w-4xl h-[90vh] md:h-[80vh] rounded-3xl flex flex-col mx-4 md:mx-auto overflow-hidden relative">
        
        <!-- Header -->
        <div class="px-6 py-4 border-b border-slate-200/60 bg-white/40 flex justify-between items-center z-10 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center shadow-[0_4px_10px_rgba(59,130,246,0.3)]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-800">NEXUS<span class="text-blue-500">CHAT</span></h1>
                    <p class="text-[10px] text-slate-500 font-semibold tracking-widest uppercase">Large File Edition</p>
                </div>
            </div>
            
            <div id="connection-status" class="hidden items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200">
                <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_6px_#34d399] animate-pulse"></div>
                <span class="text-xs font-semibold text-emerald-700" id="room-display">Connected</span>
            </div>
        </div>

        <div id="setup-screen" class="flex-1 flex flex-col md:flex-row p-6 md:p-8 gap-8 overflow-y-auto z-10">
            <!-- Host Panel -->
            <div class="flex-1 flex flex-col bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden group">
                <h2 class="text-lg font-bold text-slate-800 mb-1">Initialize Nexus</h2>
                <p class="text-xs text-slate-500 mb-6 font-medium">Create a secure room and wait for a peer.</p>
                
                <div class="flex flex-col gap-4 relative z-10">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">Encryption Password</label>
                        <input type="password" id="host-password" placeholder="Enter a strong password..." class="glass-input w-full px-4 py-3 rounded-xl text-sm placeholder-slate-400">
                    </div>
                    
                    <button id="btn-host" onclick="startHost()" class="btn-glow w-full py-3.5 rounded-xl text-sm font-semibold text-white shadow-md mt-2">
                        Generate Nexus Code
                    </button>
                    
                    <div id="host-code-display" class="hidden flex-col items-center justify-center mt-6 p-5 bg-slate-50 rounded-xl border border-slate-200">
                        <span class="text-xs font-semibold text-slate-500 mb-2">Your Connection Code</span>
                        <h3 id="generated-code" class="text-4xl font-mono font-bold tracking-widest text-blue-600 select-all">------</h3>
                        <div class="flex items-center gap-2 mt-4">
                            <svg class="animate-spin h-3.5 w-3.5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Awaiting Peer...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hidden md:flex flex-col items-center justify-center text-slate-300">
                <div class="w-[2px] h-24 bg-gradient-to-b from-transparent via-slate-200 to-transparent"></div>
                <span class="my-3 text-xs font-bold tracking-widest text-slate-400">OR</span>
                <div class="w-[2px] h-24 bg-gradient-to-b from-transparent via-slate-200 to-transparent"></div>
            </div>

            <!-- Join Panel -->
            <div class="flex-1 flex flex-col bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden group">
                <h2 class="text-lg font-bold text-slate-800 mb-1">Join Nexus</h2>
                <p class="text-xs text-slate-500 mb-6 font-medium">Connect to an existing secure room.</p>
                
                <div class="flex flex-col gap-4 relative z-10">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">Nexus Code</label>
                        <input type="text" id="join-code" placeholder="6-Character Code" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-mono uppercase tracking-widest placeholder-slate-400">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">Encryption Password</label>
                        <input type="password" id="join-password" placeholder="Host's Password..." class="glass-input w-full px-4 py-3 rounded-xl text-sm placeholder-slate-400">
                    </div>
                    
                    <button id="btn-join" onclick="joinRoom()" class="btn-glow-green w-full py-3.5 rounded-xl text-sm font-semibold text-white shadow-md mt-2">
                        Initiate Connection
                    </button>
                </div>
            </div>
        </div>

        <div id="chat-screen" class="hidden flex-col h-full z-10 bg-white/30">
            <!-- Messages Area -->
            <div id="messages" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4">
                <div class="self-center bg-slate-100 border border-slate-200 px-5 py-2 rounded-full shadow-sm mt-2 mb-4">
                    <span class="text-[10px] text-slate-600 font-bold uppercase tracking-wider flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        End-to-End Encryption Established
                    </span>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-white/80 border-t border-slate-200/80 backdrop-blur-xl flex items-end gap-3 shrink-0 rounded-b-3xl">
                <label for="file-input" class="shrink-0 w-12 h-12 flex items-center justify-center rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-blue-600 transition-colors cursor-pointer shadow-sm border border-slate-200" title="Send Large File">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    <input type="file" id="file-input" class="hidden" onchange="sendFile(this.files[0])">
                </label>
                
                <div class="flex-1 relative">
                    <textarea id="msg-input" rows="1" placeholder="Type a secure message..." class="glass-input w-full px-5 py-3.5 pr-12 rounded-2xl text-sm resize-none overflow-hidden font-medium" style="min-height: 48px;" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'" onkeypress="handleEnter(event)"></textarea>
                </div>
                
                <button onclick="sendTextMessage()" class="shrink-0 w-12 h-12 flex items-center justify-center rounded-2xl btn-glow text-white shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="ml-1"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // State
        let peer = null;
        let conn = null;
        let cryptoKey = null;
        const incomingFiles = {}; // Stores chunk data for receiver

        // Constants for Large File Transfer
        const CHUNK_SIZE = 1024 * 1024; // 1MB chunks
        const MAX_BUFFER = 16 * 1024 * 1024; // 16MB backpressure limit

        // DOM Elements
        const setupScreen = document.getElementById('setup-screen');
        const chatScreen = document.getElementById('chat-screen');
        const messagesDiv = document.getElementById('messages');
        const statusHeader = document.getElementById('connection-status');
        const roomDisplay = document.getElementById('room-display');

        // Custom Notification
        function showNotification(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const isError = type === 'error';
            const borderColor = isError ? 'border-red-200' : 'border-emerald-200';
            const iconBg = isError ? 'bg-red-50' : 'bg-emerald-50';
            const iconColor = isError ? 'text-red-500' : 'text-emerald-500';
            
            const icon = isError 
                ? `<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>`
                : `<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>`;

            toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl bg-white border ${borderColor} shadow-xl shadow-slate-200/50 toast-enter pointer-events-auto`;
            toast.innerHTML = `
                <div class="flex-shrink-0 w-8 h-8 rounded-full ${iconBg} flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${iconColor}">${icon}</svg>
                </div>
                <span class="text-sm text-slate-700 font-semibold pr-2">${message}</span>
            `;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // --- CRYPTOGRAPHY ---
        async function deriveKey(password, connectionCode) {
            try {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits", "deriveKey"]
                );
                return await crypto.subtle.deriveKey(
                    { name: "PBKDF2", salt: enc.encode(connectionCode), iterations: 100000, hash: "SHA-256" },
                    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
                );
            } catch (e) {
                console.error("Key derivation error:", e);
                showNotification("Failed to generate encryption key.");
                throw e;
            }
        }

        async function encryptData(dataArrayBuffer) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv }, cryptoKey, dataArrayBuffer
            );
            return { iv: iv, ciphertext: ciphertext };
        }

        async function decryptData(iv, ciphertext) {
            try {
                return await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv }, cryptoKey, ciphertext
                );
            } catch (e) {
                console.error("Decryption failed:", e);
                throw new Error("Decryption failed");
            }
        }

        function startHost() {
            const password = document.getElementById('host-password').value;
            if (!password) return showNotification("Encryption password is required.");

            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            const btn = document.getElementById('btn-host');
            
            btn.disabled = true;
            btn.innerHTML = 'Initializing...';
            document.getElementById('host-code-display').classList.remove('hidden');
            document.getElementById('host-code-display').classList.add('flex');
            document.getElementById('generated-code').innerText = code;

            peer = new Peer(code);
            peer.on('open', async (id) => {
                cryptoKey = await deriveKey(password, code);
                btn.innerHTML = 'Waiting for peer...';
            });
            peer.on('connection', (connection) => {
                conn = connection;
                setupDataChannel();
            });
            peer.on('error', (err) => {
                showNotification("Connection error: " + err.type);
                btn.disabled = false;
                btn.innerHTML = 'Generate Nexus Code';
                document.getElementById('host-code-display').classList.add('hidden');
                document.getElementById('host-code-display').classList.remove('flex');
            });
        }

        async function joinRoom() {
            const code = document.getElementById('join-code').value.toUpperCase().trim();
            const password = document.getElementById('join-password').value;
            
            if (!code || !password) return showNotification("Code and Password required.");
            if (code.length !== 6) return showNotification("Invalid Nexus Code length.");
            
            const btn = document.getElementById('btn-join');
            btn.disabled = true;
            btn.innerHTML = 'Connecting...';

            try {
                cryptoKey = await deriveKey(password, code);
                peer = new Peer();
                peer.on('open', () => {
                    conn = peer.connect(code, { reliable: true });
                    setupDataChannel();
                });
                peer.on('error', (err) => {
                    showNotification("Failed to connect. Is the host waiting?");
                    btn.disabled = false;
                    btn.innerHTML = 'Initiate Connection';
                });
            } catch (e) {
                btn.disabled = false;
                btn.innerHTML = 'Initiate Connection';
            }
        }

        function setupDataChannel() {
            conn.on('open', () => {
                setupScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                statusHeader.style.display = 'flex';
                roomDisplay.innerText = "Room: " + conn.peer;
                showNotification("Secure connection established!", 'success');
            });

            conn.on('data', async (payload) => {
                try {
                    if (payload.type === 'text') {
                        const decryptedBuffer = await decryptData(payload.iv, payload.ciphertext);
                        const text = new TextDecoder().decode(decryptedBuffer);
                        appendMessage(text, 'peer');
                    } 
                    else if (payload.type === 'file-meta') {
                        const decryptedBuffer = await decryptData(payload.iv, payload.ciphertext);
                        const meta = JSON.parse(new TextDecoder().decode(decryptedBuffer));
                        
                        if (meta.action === 'start') {
                            const msgId = `msg-${meta.fileId}`;
                            incomingFiles[meta.fileId] = {
                                name: meta.name,
                                totalChunks: meta.totalChunks,
                                receivedCount: 0,
                                chunks: new Array(meta.totalChunks),
                                msgId: msgId
                            };
                            createFileProgressUI(msgId, meta.name, 'peer');
                        }
                    }
                    else if (payload.type === 'file-chunk') {
                        const decryptedChunk = await decryptData(payload.iv, payload.ciphertext);
                        const fileData = incomingFiles[payload.fileId];
                        
                        if (fileData) {
                            fileData.chunks[payload.chunkIndex] = decryptedChunk;
                            fileData.receivedCount++;
                            
                            const percent = Math.round((fileData.receivedCount / fileData.totalChunks) * 100);
                            updateFileProgressUI(fileData.msgId, percent, `Receiving encrypted chunk ${fileData.receivedCount}/${fileData.totalChunks}...`);
                            
                            // Check if file is completely received
                            if (fileData.receivedCount === fileData.totalChunks) {
                                const blob = new Blob(fileData.chunks);
                                const url = URL.createObjectURL(blob);
                                
                                updateFileProgressUI(fileData.msgId, 100, 'Decryption complete.', true, url, fileData.name);
                                
                                // Free memory by clearing the chunks array
                                delete incomingFiles[payload.fileId];
                                showNotification(`${fileData.name} received successfully!`, 'success');
                            }
                        }
                    }
                } catch (err) {
                    console.error(err);
                    showNotification("Decryption failed. Data corrupted or wrong password.", "error");
                }
            });

            conn.on('close', () => {
                showNotification("Peer disconnected from Nexus.", "error");
                document.getElementById('msg-input').disabled = true;
                statusHeader.style.opacity = '0.5';
                roomDisplay.innerText = "Disconnected";
            });
        }

        async function sendTextMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !conn || !conn.open) return;

            input.value = '';
            input.style.height = ''; 
            appendMessage(text, 'self');

            try {
                const dataBuffer = new TextEncoder().encode(text);
                const encrypted = await encryptData(dataBuffer);
                
                conn.send({
                    type: 'text',
                    iv: encrypted.iv,
                    ciphertext: encrypted.ciphertext
                });
            } catch (e) {
                showNotification("Failed to encrypt message.");
            }
        }

        async function sendFile(file) {
            if (!file || !conn || !conn.open) return;
            
            const fileId = Math.random().toString(36).substring(2, 10);
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            const msgId = `msg-${fileId}`;
            
            // 1. Setup UI for Sender
            createFileProgressUI(msgId, file.name, 'self');

            try {
                // 2. Send Metadata (Encrypted)
                const meta = JSON.stringify({ action: 'start', fileId, name: file.name, size: file.size, totalChunks });
                const encryptedMeta = await encryptData(new TextEncoder().encode(meta));
                conn.send({ type: 'file-meta', iv: encryptedMeta.iv, ciphertext: encryptedMeta.ciphertext });

                // 3. Process & Send Chunks with Backpressure Control
                for (let i = 0; i < totalChunks; i++) {
                    const start = i * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, file.size);
                    const chunkBlob = file.slice(start, end);
                    const chunkBuffer = await chunkBlob.arrayBuffer();
                    
                    const encryptedChunk = await encryptData(chunkBuffer);
                    
                    // WebRTC Backpressure handling: wait if buffer is too full
                    while (conn.dataChannel && conn.dataChannel.bufferedAmount > MAX_BUFFER) {
                        await new Promise(resolve => setTimeout(resolve, 50));
                    }
                    
                    conn.send({
                        type: 'file-chunk',
                        fileId: fileId,
                        chunkIndex: i,
                        iv: encryptedChunk.iv,
                        ciphertext: encryptedChunk.ciphertext
                    });
                    
                    const percent = Math.round(((i + 1) / totalChunks) * 100);
                    updateFileProgressUI(msgId, percent, `Encrypting and sending chunk ${i + 1}/${totalChunks}...`);
                }

                // 4. Finalize Sender UI
                const localUrl = URL.createObjectURL(file);
                updateFileProgressUI(msgId, 100, 'Sent securely.', true, localUrl, file.name);
                showNotification(`${file.name} sent successfully!`, 'success');

            } catch (e) {
                console.error(e);
                showNotification("File transfer failed.", "error");
                updateFileProgressUI(msgId, 0, 'Transfer failed.', true);
            }

            document.getElementById('file-input').value = ""; // Reset input
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendTextMessage();
            }
        }

        function appendMessage(text, sender) {
            const isSelf = sender === 'self';
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isSelf ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[75%] px-5 py-3.5 text-[15px] font-medium leading-relaxed ${isSelf ? 'msg-self' : 'msg-peer'}`;
            bubble.style.wordBreak = 'break-word';
            bubble.innerText = text;
            
            wrapper.appendChild(bubble);
            messagesDiv.appendChild(wrapper);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function createFileProgressUI(msgId, fileName, sender) {
            const isSelf = sender === 'self';
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isSelf ? 'justify-end' : 'justify-start'}`;
            wrapper.id = msgId;
            
            const bubbleClasses = isSelf ? 'msg-self file-card-self text-white' : 'msg-peer file-card-peer text-slate-800';
            const iconColor = isSelf ? 'text-white' : 'text-blue-500';
            const barBg = isSelf ? 'bg-white/20' : 'bg-slate-200';
            const barFill = isSelf ? 'bg-white' : 'bg-blue-500';
            const subTextColor = isSelf ? 'text-blue-100' : 'text-slate-500';

            const html = `
                <div class="w-64 max-w-[75%] px-4 py-4 flex flex-col gap-3 ${bubbleClasses}">
                    <div class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 ${iconColor} opacity-80"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                        <span class="font-semibold text-sm truncate">${fileName}</span>
                    </div>
                    
                    <div id="${msgId}-progress-container" class="w-full ${barBg} rounded-full h-1.5 mt-1 overflow-hidden">
                        <div id="${msgId}-bar" class="${barFill} h-1.5 rounded-full transition-all duration-200" style="width: 0%"></div>
                    </div>
                    
                    <div id="${msgId}-status" class="text-[10px] ${subTextColor} font-semibold uppercase tracking-wider text-right">
                        Initializing...
                    </div>

                    <a id="${msgId}-download" class="hidden items-center justify-center gap-2 py-2.5 px-4 text-xs font-bold rounded-xl transition-colors mt-1 ${isSelf ? 'bg-white/20 hover:bg-white/30 text-white' : 'bg-blue-50 hover:bg-blue-100 text-blue-600'}" download>
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Save Securely
                    </a>
                </div>
            `;
            
            wrapper.innerHTML = html;
            messagesDiv.appendChild(wrapper);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateFileProgressUI(msgId, percent, statusText, isComplete = false, downloadUrl = null, fileName = null) {
            const bar = document.getElementById(`${msgId}-bar`);
            const status = document.getElementById(`${msgId}-status`);
            const container = document.getElementById(`${msgId}-progress-container`);
            const downloadBtn = document.getElementById(`${msgId}-download`);

            if (bar) bar.style.width = `${percent}%`;
            if (status) status.innerText = statusText;

            if (isComplete) {
                if (container) container.style.display = 'none';
                if (status) status.style.display = 'none';
                if (downloadBtn && downloadUrl) {
                    downloadBtn.href = downloadUrl;
                    downloadBtn.download = fileName;
                    downloadBtn.style.display = 'flex';
                }
            }
        }
    </script>
</body>
</html>
